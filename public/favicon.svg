<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Speed Lines -->
  <path d="M 60 200 L 140 200" stroke="#27272A" stroke-width="20" stroke-linecap="round" />
  <path d="M 40 270 L 160 270" stroke="#3F3F46" stroke-width="20" stroke-linecap="round" />
  <path d="M 70 340 L 130 340" stroke="#27272A" stroke-width="20" stroke-linecap="round" />

  <!-- Speed Track Accent Curve -->
  <path d="M 100 420 A 220 220 0 0 1 430 210" fill="none" stroke="url(#accent)" stroke-width="24" stroke-dasharray="18 14" stroke-linecap="round" opacity="0.7"/>

  <!-- Runner Figure -->
  <!-- Head -->
  <circle cx="345" cy="110" r="38" fill="#FFFFFF"/>

  <!-- Torso -->
  <path d="M 335 160 L 265 250 L 325 285 L 390 190 Z" fill="#FFFFFF"/>

  <!-- Back Arm -->
  <path d="M 285 200 L 215 215 L 165 260" fill="none" stroke="#9CA3AF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Front Arm -->
  <path d="M 345 185 L 415 230 L 450 195" fill="none" stroke="url(#accent)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Back Leg (Behind) -->
  <path d="M 270 245 L 195 320 L 130 400" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Front Leg (Forward Stride) -->
  <path d="M 305 270 L 385 340 L 450 325" fill="none" stroke="url(#accent)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
