<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Fundo escuro circular -->
  <circle cx="50" cy="50" r="48" fill="#171717" />
  
  <!-- Silhueta estilo Mickey/Oswald Rabbit -->
  <g fill="#FFFFFF">
    <!-- Orelha Esquerda -->
    <ellipse cx="36" cy="28" rx="8" ry="22" transform="rotate(-14 36 28)" />
    <!-- Orelha Direita -->
    <ellipse cx="64" cy="28" rx="8" ry="22" transform="rotate(14 64 28)" />
    
    <!-- Detalhe interno Orelha Esquerda -->
    <ellipse cx="36" cy="29" rx="4" ry="15" transform="rotate(-14 36 29)" fill="#171717" />
    <!-- Detalhe interno Orelha Direita -->
    <ellipse cx="64" cy="29" rx="4" ry="15" transform="rotate(14 64 29)" fill="#171717" />

    <!-- Cabeça Principal -->
    <circle cx="50" cy="62" r="23" />
    
    <!-- Olhinhos e Focinho fofos (estilo clássico cartoon) -->
    <ellipse cx="43" cy="57" rx="2" ry="3.5" fill="#171717" />
    <ellipse cx="57" cy="57" rx="2" ry="3.5" fill="#171717" />
    <ellipse cx="50" cy="64" rx="3.5" ry="2.5" fill="#171717" />
  </g>
</svg>
